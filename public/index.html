<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDecision AI - نظام دعم القرار الذكي لاختيار السيارة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-4 space-x-reverse">
                <div class="bg-blue-600 text-white p-3 rounded-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-car-tunnel text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">AutoDecision AI</h1>
                    <p class="text-xs text-slate-400">نظام دعم القرار الذكي | جامعة القصيم</p>
                </div>
            </div>
            
            <nav class="hidden md:flex items-center space-x-6 space-x-reverse text-sm font-medium">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="text-blue-400 hover:text-blue-300 transition py-2 border-b-2 border-blue-500"><i class="fa-solid fa-chart-pie ml-1"></i> لوحة التحكم</button>
                <button onclick="switchTab('catalog')" id="nav-catalog" class="text-slate-300 hover:text-blue-300 transition py-2"><i class="fa-solid fa-car ml-1"></i> قاعدة السيارات (86)</button>
                <button onclick="switchTab('decision')" id="nav-decision" class="text-slate-300 hover:text-blue-300 transition py-2"><i class="fa-solid fa-brain ml-1"></i> محرك التوصية الذكي</button>
                <button onclick="switchTab('tco')" id="nav-tco" class="text-slate-300 hover:text-blue-300 transition py-2"><i class="fa-solid fa-calculator ml-1"></i> حاسبة TCO</button>
                <button onclick="switchTab('whatif')" id="nav-whatif" class="text-slate-300 hover:text-blue-300 transition py-2"><i class="fa-solid fa-sliders ml-1"></i> محاكاة السيناريوهات</button>
                <button onclick="switchTab('compare')" id="nav-compare" class="text-slate-300 hover:text-blue-300 transition py-2"><i class="fa-solid fa-scale-balanced ml-1"></i> المقارنة المتقدمة</button>
            </nav>

            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs text-slate-300">
                    <i class="fa-solid fa-user-shield text-blue-400 ml-1"></i> أبو نورة (تجريبي)
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

        <!-- 1. DASHBOARD TAB -->
        <section id="tab-dashboard" class="space-y-6">
            <div class="bg-gradient-to-r from-blue-900/40 to-slate-900 border border-blue-500/20 rounded-2xl p-6 sm:p-8">
                <div class="max-w-3xl">
                    <span class="bg-blue-500/10 text-blue-400 text-xs px-3 py-1 rounded-full font-semibold border border-blue-500/30">مش
